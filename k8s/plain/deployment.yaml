apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-api
  template:
    metadata:
      labels:
        app: bluegreen-api
    spec:
      containers:
        - name: api
          image: acrbluegreenutrsvz.azurecr.io/bluegreen-api:v1
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: DATABASE_URL
            - name: APP_VERSION
              value: v1
            - name: APP_COLOR
              value: blue
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-api
spec:
  type: LoadBalancer
  selector:
    app: bluegreen-api
  ports:
    - port: 80
      targetPort: 8000
