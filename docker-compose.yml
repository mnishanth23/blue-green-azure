services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      APP_VERSION: v1
      APP_COLOR: blue
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
